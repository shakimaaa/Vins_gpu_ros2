%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1         
num_of_cam: 2

imu_topic: "/mav/imu/data_raw"
image0_topic: "/camera/camera/infra1/image_rect_raw"
image1_topic: "/camera/camera/infra2/image_rect_raw"


output_path: "/home/alexmanson/altivision/vins_config"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480
   

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.030865273674851368, -0.10794544506469386,
       0.99367757133325796, 0.20604097280119107, -0.99768392248666771,
       -0.06361598920625533, 0.024078968601803797, 0.050025593107547894,
       0.060614566670014018, -0.99211934101049304, -0.10965895996366037,
       -0.1017736458681905, 0., 0., 0., 1. ]
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.029538996764818859, -0.10862277508181932,
       0.99364407128692356, 0.20553078051284754, -0.99770477049915762,
       -0.063801062615437942, 0.022685134612001733, 0.001797298660589275,
       0.060931425334975413, -0.99203352621908181, -0.11025808026617767,
       -0.098058635777136749, 0., 0., 0., 1. ]
#Multiple thread support
multiple_thread: 1

#feature traker paprameters
max_cnt: 100            # max feature number in feature tracking
min_dist: 30            # min distance between two features 
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.2        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.005  # max solver itration time (ms), to guarantee real time
max_num_iterations: 10   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.9          # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 0.09         # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 0.009         # accelerometer bias random work noise standard deviation.  #0.002
gyr_w: 0.0009       # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.81         # gravity magnitude

#unsynchronization parameters
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0.009121                           # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "/home/greymatters/project/altivision/src/XVoyager/loop_fusion/config" # save and load path
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 


use_gpu_acc_flow: 1            # use gpu for accumulate flow; 1: use gpu; 0: use cpu
